---

name: 🧪 Unit testing

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - 1.x
  push:
    branches:
      - 1.x

jobs:
  testing:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    env:
      COMPOSER_ROOT_VERSION: '1.x-dev'
    concurrency:
      cancel-in-progress: true
      group: testing-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.php-version }}-${{ matrix.dependencies }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        php-version:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        dependencies:
          # - lowest
          # - locked
          - highest
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v6

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          ini-values: error_reporting=E_ALL

      - name: 🤖 Validate composer.json and composer.lock
        run: composer validate --ansi --strict

      # Remove unused libs
      - name: 🧹 Remove Infection (incompatible with PHP 8.2)
        run: composer remove --dev infection/infection vimeo/psalm spiral/code-style buggregator/trap testo/bridge-infection --no-update --no-interaction

      - name: 📥 Install dependencies with composer
        if: matrix.php-version != '8.1'
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: 📥 Install and downgrade for PHP 8.1
        if: matrix.php-version == '8.1'
        uses: php-internal/actions/downgrade@v1
        with:
          php-version: '8.1'
          dependency-versions: ${{ matrix.dependencies }}
          # Downgrade the test harness (which uses 8.2+ syntax) and the testo config, but not src:
          # the shipped library must be exercised on 8.1 as written.
          paths: tests testo.php

      - name: 🧪 Run tests
        run: composer test
