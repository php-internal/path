---

name: ✨ Vibe Index

on:  # yamllint disable-line rule:truthy
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vibe-index:
    # Run only on the default branch — no branch name to hardcode.
    if: github.ref_name == github.event.repository.default_branch
    timeout-minutes: 4
    runs-on: ubuntu-latest
    concurrency:
      cancel-in-progress: true
      group: vibe-index-${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # the action needs full git history

      - name: ✨ Refresh the Vibe Index badge
        uses: roxblnfk/action-vibe-index@v1
        with:
          commit: true
          push: true

...
